# Déploiement sur le NAS QNAP : Container Station > Applications > Créer, coller ce fichier
services:
  music:
    image: ynizon/music:latest
    container_name: music-gameandme
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Reverse proxy autorisé à transmettre l'IP du client (réseau Docker + localhost)
      TRUSTED_PROXIES: "172.16.0.0/12 127.0.0.1"
    volumes:
      # Configuration et données du site, dans le dossier existant sur le NAS
      - /share/CACHEDEV1_DATA/nas/web/music.gameandme.fr/.env:/var/www/html/.env:ro
      - /share/CACHEDEV1_DATA/nas/web/music.gameandme.fr/storage:/var/www/html/storage
      - /share/CACHEDEV1_DATA/nas/web/music.gameandme.fr/database:/data/database
      - /share/CACHEDEV1_DATA/nas/web/music.gameandme.fr/public/images/cache:/var/www/html/public/images/cache
      # Partage nas monté aux mêmes chemins que sur l'hôte (MUSIC_FOLDER, PATH_MUSIC*, spotdl)
      - /share/CACHEDEV1_DATA/nas:/share/CACHEDEV1_DATA/nas
      - /share/CACHEDEV1_DATA/nas:/share/nas
      # Docker de l'hôte pour lancer spotdl
      - /var/run/docker.sock:/var/run/docker.sock
