# Déploiement sur le NAS QNAP : Container Station > Applications > Créer, coller ce fichier
services:
  music:
    image: ynizon/music:latest
    container_name: music-gameandme
    restart: unless-stopped
    ports:
      - "6000:80"
    environment:
      # Reverse proxy autorisé à transmettre l'IP du client : bridge Container Station QNAP (10.0.3.0/24),
      # réseaux Docker standard (172.16.0.0/12) et localhost. Sans le bridge QNAP, REMOTE_ADDR reste
      # la passerelle 10.0.3.1 pour tout le monde et RESTRICT_IP ne filtre rien.
      TRUSTED_PROXIES: "10.0.3.0/24 172.16.0.0/12 127.0.0.1"
    volumes:
      # Tout le site (code + .env, storage, database) : modifiable depuis le NAS
      - /share/CACHEDEV1_DATA/nas/web/music.gameandme.fr:/var/www/html
      # Partage nas monté aux mêmes chemins que sur l'hôte (MUSIC_FOLDER, PATH_MUSIC*, spotdl)
      - /share/CACHEDEV1_DATA/nas:/share/CACHEDEV1_DATA/nas
      - /share/CACHEDEV1_DATA/nas:/share/nas
      # Docker de l'hôte pour lancer spotdl
      - /var/run/docker.sock:/var/run/docker.sock
