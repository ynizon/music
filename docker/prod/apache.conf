<VirtualHost *:80>
    ServerName music.gameandme.fr
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Derrière le reverse proxy : REMOTE_ADDR = vraie IP du client (utilisée par RESTRICT_IP dans routes/web.php)
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${TRUSTED_PROXIES}

    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log proxied
</VirtualHost>
